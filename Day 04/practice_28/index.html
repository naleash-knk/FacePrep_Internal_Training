<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Amirthu Restaurant</h1>
    <div class="menu">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="Burger Image">
            <h2>Cheese Burger</h2>
            <p class="price">Rs.180/-</p>
            <button type="button">Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=500" alt="Pizza Image">
            <h2>Veg Pizza</h2>
            <p class="price">Rs.250/-</p>
            <button type="button">Order Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500" alt="Pasta Image">
            <h2>White Sauce Pasta</h2>
            <p class="price">Rs.220/-</p>
            <button type="button">Order Now</button>
        </div>
        

        
    </div>
    <script src="script.js"></script>
</body>
</html>
