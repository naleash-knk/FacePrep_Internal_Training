<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>

    <h2>Ordered List</h2>

    <ol>
        <li>Wake Up</li>
        <li>Exercise</li>
        <li>Breakfast</li>
        <li>Study HTML</li>
        <li>Practice Coding</li>
    </ol>

    <h2>Unordered List</h2>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
    </ul>

    <h2>Nested List</h2>

    <ul>
        <li>Frontend
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </li>

        <li>Backend
            <ul>
                <li>Node.js</li>
                <li>Express</li>
            </ul>
        </li>
    </ul>

</body>
</html>
