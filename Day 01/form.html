<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>Student Registration</h1>

    <form>

        <label>Full Name</label>
        <br>
        <input type="text">
        <br><br>

        <label>Email</label>
        <br>
        <input type="email">
        <br><br>

        <label>Password</label>
        <br>
        <input type="password">
        <br><br>

        <label>Age</label>
        <br>
        <input type="number">
        <br><br>

        <label>Date of Birth</label>
        <br>
        <input type="date">
        <br><br>

        <label>Gender</label>
        <br>

        <input type="radio" name="gender">
        Male

        <input type="radio" name="gender">
        Female

        <br><br>

        <label>Skills</label>

        <br>

        <input type="checkbox">
        HTML

        <input type="checkbox">
        CSS

        <input type="checkbox">
        JavaScript

        <br><br>

        <label>Department</label>

        <br>

        <select>

            <option>CSE</option>
            <option>IT</option>
            <option>ECE</option>
            <option>Mechanical</option>

        </select>

        <br><br>

        <label>Address</label>

        <br>

        <textarea rows="5" cols="30"></textarea>

        <br><br>

        <button>Submit</button>

        <button type="reset">Reset</button>

    </form>

</body>
</html>
